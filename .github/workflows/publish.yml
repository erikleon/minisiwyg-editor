name: Publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - CHANGELOG.md

jobs:
  create-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and create tag
        id: tag
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            echo "Tag $VERSION already exists — skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # About to release. The GitHub release notes are read out of the
          # CHANGELOG.md section matching this version, and an "## [Unreleased]"
          # heading does not match — so without this check the run would tag,
          # publish to npm, and then cut a release with no notes at all.
          # Checked here rather than at release time so a mistake costs nothing:
          # no tag, no publish, and the next push retries cleanly.
          NOTES=$(awk "/^## \\[v?${VERSION#v}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No release notes for $VERSION. Rename the '## [Unreleased]' heading to '## [$VERSION]' in the same commit as the package.json bump."
            exit 1
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    if: always() && !cancelled() && !failure()
    needs: [create-tag]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Decide whether to publish
        id: gate
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          TAG_CREATED: ${{ needs.create-tag.outputs.created }}
          TAG_VERSION: ${{ needs.create-tag.outputs.version }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$GIT_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_CREATED" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_publish == 'true'
        with:
          ref: ${{ steps.gate.outputs.version }}
      # create-tag runs only for pushes to main, so a hand-pushed v* tag reaches
      # this job without its release notes ever being checked. Repeat the check
      # here, still ahead of npm publish.
      - name: Verify release notes exist
        if: steps.gate.outputs.should_publish == 'true'
        env:
          PUBLISH_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          NOTES=$(awk "/^## \\[v?${PUBLISH_VERSION#v}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No release notes for $PUBLISH_VERSION. Add a '## [$PUBLISH_VERSION]' section before tagging."
            exit 1
          fi
      # Must stay at or above what the npm version installed below supports.
      # Publishing needs npm >= 11.5.1 for OIDC trusted publishing, which is
      # newer than the npm any Node 20 runner bundles — so the global install
      # is not optional, and the Node version has to keep up with it.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_publish == 'true'
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install and verify
        if: steps.gate.outputs.should_publish == 'true'
        env:
          PUBLISH_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          npm install -g npm@latest
          npm ci
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${PUBLISH_VERSION#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Test and build
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run size-check
      - name: Browser tests
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          npx playwright install --with-deps
          npm run test:browser
      - name: Publish to npm
        if: steps.gate.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          BODY=$(awk "/^## \\[${PUBLISH_VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            PLAIN="${PUBLISH_VERSION#v}"
            BODY=$(awk "/^## \\[v?${PLAIN}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          fi
          echo "$BODY" | gh release create "$PUBLISH_VERSION" \
            --title "$PUBLISH_VERSION" \
            --notes-file -
